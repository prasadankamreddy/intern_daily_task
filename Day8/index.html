<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Day 8: Interactive Task List</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div class="container">
        <h1>Task Manager</h1>

        <!-- Task Form -->
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Enter a new task..." autocomplete="off">
            <button type="submit">Add Task</button>
        </form>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Task List -->
        <ul id="task-list"></ul>
    </div>

    <script src="app.js"></script>
</body>

</html>
