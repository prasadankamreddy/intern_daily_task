<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - Price Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }

        .calculator {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            max-width: 100%;
            box-shadow: 0 4px 15px #cccccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h2>Price Calculator</h2>

        <label for="price">Enter price per item:</label>
        <input type="number" id="price" placeholder="Enter price" min="0" step="any">

        <label for="quantity">Enter quantity:</label>
        <input type="number" id="quantity" placeholder="Enter quantity" min="1" step="1">

        <label for="discount">Enter discount (%):</label>
        <input type="number" id="discount" placeholder="Enter discount percentage" min="0" max="100" step="any">

        <button onclick="calculateTotal()">Calculate Total</button>

        <div id="result"></div>
    </div>

    <script src="calculate.js"></script>
</body>

</html>
