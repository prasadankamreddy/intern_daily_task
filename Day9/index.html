
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Browser Tracker</h1>

        <form id="recordForm">
            <input type="text" id="recordName" placeholder="Enter record name">

            <input type="text" id="recordCategory" placeholder="Enter category">

            <button type="submit">Add Record</button>
        </form>

        <p id="message"></p>

        <h2>Records List</h2>
        <ul id="recordsList"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
